<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hexagon -->
  <polygon points="250,50 400,140 400,360 250,450 100,360 100,140"
           fill="url(#grad)" stroke="#0f172a" stroke-width="8"/>

  <!-- White Banner -->
  <rect x="75" y="210" width="350" height="80" rx="40"
        fill="#ffffff" stroke="#e5e7eb" stroke-width="3"/>

  <!-- Stars / Triangles (4 total now) -->
  <polygon points="160,105 170,135 150,135" fill="#facc15"/>
  <polygon points="210,105 220,135 200,135" fill="#facc15"/>
  <polygon points="260,105 270,135 250,135" fill="#facc15"/>
  <polygon points="310,105 320,135 300,135" fill="#facc15"/>

  <!-- Text -->
  <text x="250" y="170" text-anchor="middle" fill="#ffffff"
        font-size="28" font-family="Arial" font-weight="bold">FRAMEWORK</text>

  <text x="250" y="260" text-anchor="middle" fill="#111827"
        font-size="36" font-family="Arial" font-weight="bold">NextJS</text>

  <text x="250" y="330" text-anchor="middle" fill="#ffffff"
        font-size="26" font-family="Arial" font-weight="bold">DEVELOPER</text>
</svg>
